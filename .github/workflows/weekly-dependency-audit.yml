name: Weekly dependency audit

on:
  schedule:
    - cron: '30 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-dependency-audit
  cancel-in-progress: true

jobs:
  audit:
    name: Weekly dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install pinned security scanners
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all:
          bandit==1.9.4 pip-audit==2.10.1

      - name: Run Bandit
        run: bandit -r logger.py -q

      - name: Audit pinned dependencies
        run: pip-audit -r requirements.txt --no-deps --disable-pip --strict
