name: Security notifications

on:
  workflow_run:
    workflows:
      - Security scans
      - Weekly dependency audit
      - CodeQL
    types: [completed]
  check_run:
    types: [completed]
  schedule:
    - cron: '15 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: read
  issues: write
  security-events: read

concurrency:
  group: security-notifications
  cancel-in-progress: false

jobs:
  notify:
    name: Notify security team
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success') ||
      (github.event_name == 'check_run' &&
       github.event.check_run.name == 'SonarCloud Code Analysis' &&
       github.event.check_run.conclusion != 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create or update security notifications
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v8.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const securityLabels = ['security', 'security-audit'];

            async function findIssue(marker) {
              const response = await github.rest.issues.listForRepo({
                owner,
                repo,
                state: 'all',
                labels: 'security',
                per_page: 100,
              });
              return response.data.find((issue) => issue.body?.includes(marker));
            }

            async function notify({ marker, title, body, reopen = false }) {
              const existing = await findIssue(marker);
              if (!existing) {
                const created = await github.rest.issues.create({
                  owner,
                  repo,
                  title,
                  body,
                  labels: securityLabels,
                });
                core.info(`Created security notification issue #${created.data.number}`);
                return;
              }

              if (reopen && existing.state === 'closed') {
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: existing.number,
                  state: 'open',
                  labels: securityLabels,
                });
                core.info(`Reopened security notification issue #${existing.number}`);
              }

              if (existing.state === 'open') {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: existing.number,
                  body: `${body}\n\nThis notification was refreshed automatically.`
                });
                core.info(`Updated security notification issue #${existing.number}`);
              }
            }

            if (context.eventName === 'workflow_run') {
              const run = context.payload.workflow_run;
              const marker = `<!-- security-notification:workflow-run:${run.name}:${run.head_branch}:${run.head_sha} -->`;
              const title = `Security audit failed: ${run.name}`;
              const body = [
                marker,
                `A security-related workflow failed on **${run.head_branch || 'unknown branch'}**.`,
                '',
                `- Workflow: ${run.name}`,
                `- Conclusion: ${run.conclusion}`,
                `- Commit: ${run.head_sha}`,
                `- Run: ${run.html_url}`,
                '',
                'Investigate the failed job before merging or deploying changes.',
              ].join('\n');
              await notify({ marker, title, body });
            }

            if (context.eventName === 'check_run') {
              const check = context.payload.check_run;
              const marker = `<!-- security-notification:check-run:${check.name}:${check.head_sha} -->`;
              const body = [
                marker,
                `The **${check.name}** security quality check failed.`,
                '',
                `- Conclusion: ${check.conclusion}`,
                `- Commit: ${check.head_sha}`,
                `- Check: ${check.html_url}`,
                '',
                'Review the provider findings and resolve the quality-gate failure.',
              ].join('\n');
              await notify({
                marker,
                title: `Security quality check failed: ${check.name}`,
                body,
              });
            }

            if (context.eventName === 'schedule' || context.eventName === 'workflow_dispatch') {
              const alerts = await github.paginate(
                'GET /repos/{owner}/{repo}/dependabot/alerts',
                { owner, repo, state: 'open', per_page: 100 },
              );

              core.info(`Found ${alerts.length} open Dependabot alert(s)`);
              for (const item of alerts) {
                const alert = item;
                const dependency = alert.dependency?.package?.name || 'unknown dependency';
                const severity = alert.security_advisory?.severity || 'unknown severity';
                const marker = `<!-- security-notification:dependabot-alert:${alert.number} -->`;
                const body = [
                  marker,
                  `Dependabot reports an open vulnerability in **${dependency}**.`,
                  '',
                  `- Alert: #${alert.number}`,
                  `- Severity: ${severity}`,
                  `- Manifest: ${alert.dependency?.manifest_path || 'unknown'}`,
                  `- Vulnerable range: ${alert.security_vulnerability?.vulnerable_version_range || 'unknown'}`,
                  `- First detected: ${alert.created_at || 'unknown'}`,
                  `- Alert: ${alert.html_url || 'https://github.com/' + owner + '/' + repo + '/security/dependabot'}`,
                  '',
                  'Review the alert, apply the recommended upgrade, and close this issue only after the alert is resolved.',
                ].join('\n');
                await notify({
                  marker,
                  title: `Security vulnerability: ${dependency}`,
                  body,
                  reopen: true,
                });
              }
            }
